<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タジゼミ削除ツール</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f9fafb;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(680px, 100%);
      background: #111827;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { color: #cbd5e1; line-height: 1.7; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      background: #fb7185;
      color: #111827;
      margin-top: 12px;
    }
    .ghost {
      background: transparent;
      color: #f9fafb;
      border: 1px solid #334155;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      color: #d1fae5;
      min-height: 120px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>タジゼミ削除ツール</h1>
    <p>
      このページは一時的な修正用です。<br>
      localStorage と Supabase の <strong>study_tasks</strong> から、タイトルに「タジゼミ」を含むタスクとくり返し設定を削除します。
    </p>

    <button id="cleanupBtn">タジゼミ関連を削除する</button>
    <button class="ghost" id="goHomeBtn">本体に戻る</button>

    <h2>結果</h2>
    <pre id="result">まだ実行していません。</pre>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const STORAGE_KEY = "focus_dashboard_v1";

    const SUPABASE_URL = "https://ghmitazvjjmeaydofflq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdobWl0YXp2amptZWF5ZG9mZmxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2ODQ3MTMsImV4cCI6MjA5NjI2MDcxM30.1jIDXBidNrSHzUJTOPTp8hN5uImT6OpsVQoWVn6AVdM";
    const SUPABASE_USER_ID = "default-user";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const result = document.getElementById("result");

    function log(message) {
      result.textContent += message + "\n";
    }

    async function cleanup() {
      result.textContent = "";
      log("削除処理を開始します...");

      // 1. localStorage cleanup
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);

          const beforeTasks = Array.isArray(data.tasks) ? data.tasks.length : 0;
          const beforeTemplates = Array.isArray(data.recurringTemplates) ? data.recurringTemplates.length : 0;

          data.tasks = (data.tasks || []).filter(t => !String(t.title || "").includes("タジゼミ"));
          data.recurringTemplates = (data.recurringTemplates || []).filter(t => !String(t.title || "").includes("タジゼミ"));

          const afterTasks = data.tasks.length;
          const afterTemplates = data.recurringTemplates.length;

          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

          log(`localStorage: タスク ${beforeTasks - afterTasks}件 削除`);
          log(`localStorage: くり返し設定 ${beforeTemplates - afterTemplates}件 削除`);
        } else {
          log("localStorage: データが見つかりませんでした。");
        }
      } catch (error) {
        log("localStorage削除エラー: " + error.message);
      }

      // 2. Supabase cleanup
      try {
        log("Supabase: study_tasks を確認中...");

        const { data, error } = await supabaseClient
          .from("study_tasks")
          .select("id, task_data")
          .eq("user_id", SUPABASE_USER_ID);

        if (error) throw error;

        const targets = (data || []).filter(row => {
          const title = row.task_data && row.task_data.title ? String(row.task_data.title) : "";
          return title.includes("タジゼミ");
        });

        log(`Supabase: 削除対象 ${targets.length}件`);

        if (targets.length > 0) {
          const ids = targets.map(row => row.id);

          const deleteResult = await supabaseClient
            .from("study_tasks")
            .delete()
            .in("id", ids);

          if (deleteResult.error) throw deleteResult.error;

          log(`Supabase: ${targets.length}件 削除しました。`);
        } else {
          log("Supabase: 削除対象はありません。");
        }
      } catch (error) {
        log("Supabase削除エラー: " + error.message);
      }

      log("");
      log("完了です。");
      log("次に本体へ戻って「アプリ更新」→「同期」を押してください。");
    }

    document.getElementById("cleanupBtn").addEventListener("click", cleanup);
    document.getElementById("goHomeBtn").addEventListener("click", () => {
      location.href = "index.html?v=" + Date.now();
    });
  </script>
</body>
</html>
