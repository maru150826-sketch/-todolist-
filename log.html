<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学習ログ・カレンダー</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.14), transparent 34%),
        radial-gradient(circle at bottom right, rgba(167,139,250,.14), transparent 32%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 22px;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      background: rgba(17, 24, 39, .90);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      color: #07111f;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
    }

    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(15,23,42,.78);
      color: var(--text);
      outline: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 12px;
    }

    .pill {
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: #e5e7eb;
    }

    .day-card {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .day-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .day-title {
      font-weight: 900;
      font-size: 16px;
    }

    .day-total {
      color: var(--accent);
      font-weight: 900;
    }

    .section-title {
      margin-top: 10px;
      margin-bottom: 6px;
      font-weight: 900;
      color: #f3f4f6;
    }

    .group-list {
      display: grid;
      gap: 6px;
    }

    .group-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(15,23,42,.55);
      border-radius: 12px;
      padding: 8px 10px;
      line-height: 1.45;
    }

    .group-title {
      font-weight: 800;
    }

    .group-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .group-time {
      color: var(--ok);
      font-weight: 900;
      white-space: nowrap;
    }

    .task-line {
      color: #e5e7eb;
      font-size: 13px;
      line-height: 1.65;
    }

    .task-line.done {
      color: #d1fae5;
    }

    .task-line.pending {
      color: #fde68a;
    }

    .notice {
      border: 1px solid rgba(251,191,36,.35);
      background: rgba(251,191,36,.08);
      color: #fde68a;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      body { padding: 14px; }
      header { flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>学習ログ・カレンダー</h1>
        <div class="small">同じ日・同じカテゴリ・同じタイトルの記録は、1項目に合算して表示します。</div>
      </div>
      <button class="ghost" onclick="location.reload()">再読み込み</button>
    </header>

    <div class="notice">
      表示が変わらない場合は、このページのURLが <strong>.../log.html</strong> になっているか確認してください。その後 <strong>Ctrl + F5</strong> を押してください。
    </div>

    <section class="panel" style="margin-bottom:16px;">
      <h2>表示条件</h2>
      <div class="controls">
        <input type="date" id="dateInput" />
        <select id="rangeInput">
          <option value="1">選択日だけ</option>
          <option value="7">直近7日</option>
          <option value="30">直近30日</option>
          <option value="all">全期間</option>
        </select>
        <button id="todayBtn">今日</button>
      </div>
      <div class="summary" id="overallSummary"></div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>日別ログ</h2>
        <div id="dayList"></div>
      </section>

      <section class="panel">
        <h2>週別サマリー</h2>
        <div id="weekList"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "focus_dashboard_v1";

    const $ = (id) => document.getElementById(id);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { tasks: [], sessions: [], reviews: {} };
        const parsed = JSON.parse(raw);
        return {
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
          reviews: parsed.reviews || {}
        };
      } catch {
        return { tasks: [], sessions: [], reviews: {} };
      }
    }

    function todayKey() {
      const d = new Date();
      return toDateKey(d);
    }

    function toDateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatMinutes(min) {
      min = Number(min || 0);
      if (min < 60) return `${min}分`;
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m === 0 ? `${h}時間` : `${h}時間${m}分`;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeTitle(title) {
      return String(title || "未選択")
        .replace(/\s+/g, " ")
        .trim();
    }

    function groupSessions(sessions) {
      const map = new Map();

      for (const s of sessions) {
        const title = normalizeTitle(s.taskTitle || s.title || "未選択");
        const category = s.category || "その他";
        const key = `${category}|||${title}`;

        if (!map.has(key)) {
          map.set(key, {
            title,
            category,
            minutes: 0,
            count: 0,
            manual: 0,
            pomo: 0
          });
        }

        const row = map.get(key);
        row.minutes += Number(s.minutes || 0);
        row.count += 1;
        if (s.type === "manual") row.manual += 1;
        else row.pomo += 1;
      }

      return Array.from(map.values())
        .sort((a, b) => {
          if (b.minutes !== a.minutes) return b.minutes - a.minutes;
          return a.title.localeCompare(b.title, "ja");
        });
    }

    function getDateRange() {
      const state = loadState();
      const range = $("rangeInput").value;
      const selected = $("dateInput").value || todayKey();

      const allDates = new Set([
        ...state.sessions.map(s => s.date).filter(Boolean),
        ...state.tasks.map(t => t.date).filter(Boolean),
        ...Object.keys(state.reviews || {})
      ]);

      if (range === "all") {
        return Array.from(allDates).sort((a, b) => b.localeCompare(a));
      }

      const days = Number(range);
      const end = parseDateKey(selected);
      const start = new Date(end);
      start.setDate(start.getDate() - (days - 1));

      const result = [];
      const d = new Date(end);
      while (d >= start) {
        result.push(toDateKey(d));
        d.setDate(d.getDate() - 1);
      }
      return result;
    }

    function categorySummary(sessions) {
      const byCat = {};
      for (const s of sessions) {
        const cat = s.category || "その他";
        byCat[cat] = (byCat[cat] || 0) + Number(s.minutes || 0);
      }
      return Object.entries(byCat)
        .sort((a, b) => b[1] - a[1])
        .map(([cat, min]) => `<span class="pill">${escapeHtml(cat)} ${formatMinutes(min)}</span>`)
        .join("");
    }

    function renderDayList() {
      const state = loadState();
      const dates = getDateRange();
      const box = $("dayList");

      const allRangeSessions = state.sessions.filter(s => dates.includes(s.date));
      const total = allRangeSessions.reduce((sum, s) => sum + Number(s.minutes || 0), 0);
      $("overallSummary").innerHTML = `
        <span class="pill">合計 ${formatMinutes(total)}</span>
        <span class="pill">記録 ${allRangeSessions.length}件</span>
        ${categorySummary(allRangeSessions)}
      `;

      if (dates.length === 0) {
        box.innerHTML = `<div class="small">まだログがありません。</div>`;
        return;
      }

      box.innerHTML = dates.map(date => {
        const sessions = state.sessions.filter(s => s.date === date);
        const tasks = state.tasks.filter(t => t.date === date);
        const grouped = groupSessions(sessions);
        const dayTotal = sessions.reduce((sum, s) => sum + Number(s.minutes || 0), 0);

        const groupedHtml = grouped.length
          ? grouped.map(g => `
            <div class="group-item">
              <div>
                <div class="group-title">${escapeHtml(g.title)}</div>
                <div class="group-meta">${escapeHtml(g.category)} / ${g.count}件を合算${g.manual ? ` / 手動${g.manual}件` : ""}</div>
              </div>
              <div class="group-time">${formatMinutes(g.minutes)}</div>
            </div>
          `).join("")
          : `<div class="small">記録なし</div>`;

        const taskHtml = tasks.length
          ? tasks.map(t => `
            <div class="task-line ${t.done ? "done" : "pending"}">
              □ ${escapeHtml(t.title)}（${t.done ? "完了" : "未完了"}）
            </div>
          `).join("")
          : `<div class="small">タスクなし</div>`;

        const review = state.reviews && state.reviews[date] ? `
          <div class="section-title">振り返り</div>
          <div class="small">${escapeHtml(state.reviews[date])}</div>
        ` : "";

        return `
          <div class="day-card">
            <div class="day-head">
              <div class="day-title">${date}</div>
              <div class="day-total">${formatMinutes(dayTotal)}</div>
            </div>
            <div class="summary">${categorySummary(sessions)}</div>
            <div class="section-title">やったこと</div>
            <div class="group-list">${groupedHtml}</div>
            <div class="section-title">タスク</div>
            ${taskHtml}
            ${review}
          </div>
        `;
      }).join("");
    }

    function getWeekStartKey(dateKey) {
      const d = parseDateKey(dateKey);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return toDateKey(d);
    }

    function getWeekEndKey(weekStartKey) {
      const d = parseDateKey(weekStartKey);
      d.setDate(d.getDate() + 6);
      return toDateKey(d);
    }

    function renderWeekList() {
      const state = loadState();
      const dates = getDateRange();
      const weeks = {};

      for (const date of dates) {
        const week = getWeekStartKey(date);
        if (!weeks[week]) weeks[week] = [];
        weeks[week].push(date);
      }

      const weekKeys = Object.keys(weeks).sort((a, b) => b.localeCompare(a));
      const box = $("weekList");

      if (!weekKeys.length) {
        box.innerHTML = `<div class="small">週別データがありません。</div>`;
        return;
      }

      box.innerHTML = weekKeys.map(weekStart => {
        const weekEnd = getWeekEndKey(weekStart);
        const weekDates = weeks[weekStart];
        const sessions = state.sessions.filter(s => weekDates.includes(s.date));
        const grouped = groupSessions(sessions);
        const total = sessions.reduce((sum, s) => sum + Number(s.minutes || 0), 0);

        const groupedHtml = grouped.length
          ? grouped.map(g => `
            <div class="group-item">
              <div>
                <div class="group-title">${escapeHtml(g.title)}</div>
                <div class="group-meta">${escapeHtml(g.category)} / ${g.count}件を合算</div>
              </div>
              <div class="group-time">${formatMinutes(g.minutes)}</div>
            </div>
          `).join("")
          : `<div class="small">記録なし</div>`;

        return `
          <div class="day-card">
            <div class="day-head">
              <div class="day-title">${weekStart} 〜 ${weekEnd}</div>
              <div class="day-total">${formatMinutes(total)}</div>
            </div>
            <div class="summary">${categorySummary(sessions)}</div>
            <div class="section-title">合算したやったこと</div>
            <div class="group-list">${groupedHtml}</div>
          </div>
        `;
      }).join("");
    }

    function render() {
      renderDayList();
      renderWeekList();
    }

    $("dateInput").value = todayKey();
    $("todayBtn").addEventListener("click", () => {
      $("dateInput").value = todayKey();
      $("rangeInput").value = "1";
      render();
    });
    $("dateInput").addEventListener("change", render);
    $("rangeInput").addEventListener("change", render);

    render();
  </script>
</body>
</html>
