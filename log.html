<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学習ログ確認ページ</title>
  <style>
    :root {
      --bg:#0f172a;
      --panel:#111827;
      --text:#f9fafb;
      --muted:#9ca3af;
      --line:#374151;
      --accent:#38bdf8;
      --warn:#fbbf24;
      --danger:#fb7185;
      --ok:#34d399;
      --radius:18px;
      --shadow:0 20px 60px rgba(0,0,0,.35);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:"Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.16), transparent 35%),
        radial-gradient(circle at bottom right, rgba(251,113,133,.12), transparent 35%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:24px;
    }

    .app {
      max-width:1280px;
      margin:0 auto;
    }

    header {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      margin-bottom:20px;
    }

    h1 {
      margin:0;
      font-size:28px;
    }

    h2 {
      margin:0 0 14px;
      font-size:18px;
    }

    .date {
      color:var(--muted);
      font-size:14px;
      margin-top:5px;
    }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .panel {
      background:rgba(17,24,39,.88);
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
    }

    button, select {
      font:inherit;
    }

    button {
      border:0;
      border-radius:12px;
      padding:10px 14px;
      color:#07111f;
      background:var(--accent);
      font-weight:800;
      cursor:pointer;
    }

    button.ghost {
      background:transparent;
      color:var(--text);
      border:1px solid var(--line);
    }

    button:hover {
      opacity:.92;
    }

    .small {
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .notice {
      padding:12px 14px;
      border:1px solid rgba(251,191,36,.35);
      background:rgba(251,191,36,.08);
      border-radius:14px;
      margin-bottom:18px;
      color:#fde68a;
      line-height:1.6;
      font-size:14px;
    }

    .calendar-controls {
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:8px;
      align-items:center;
      margin-bottom:8px;
    }

    .calendar-title {
      text-align:center;
      font-weight:900;
      font-size:18px;
    }

    .calendar-grid {
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
      margin-top:10px;
    }

    .calendar-day-name {
      color:var(--muted);
      text-align:center;
      font-size:12px;
      padding:4px 0;
    }

    .calendar-day {
      min-height:70px;
      padding:8px;
      border-radius:12px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      cursor:pointer;
      font-size:12px;
    }

    .calendar-day:hover {
      border-color:var(--accent);
    }

    .calendar-day.today {
      border-color:rgba(56,189,248,.7);
      background:rgba(56,189,248,.12);
    }

    .calendar-day.empty {
      opacity:.25;
      cursor:default;
    }

    .calendar-num {
      font-weight:900;
      margin-bottom:4px;
    }

    .calendar-min {
      color:var(--accent);
      font-weight:900;
      margin-bottom:4px;
    }

    .calendar-task {
      color:#fbbf24;
      font-size:11px;
    }

    .detail {
      margin-top:12px;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      font-size:13px;
      line-height:1.6;
    }

    .mini-tags {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin:8px 0;
    }

    .mini-tag {
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
      color:#d1d5db;
      border-radius:999px;
      padding:4px 8px;
      font-size:12px;
    }

    .summary-controls {
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:8px;
      margin-bottom:12px;
    }

    select {
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      background:rgba(15,23,42,.78);
      color:var(--text);
      outline:none;
    }

    .study-table {
      width:100%;
      border-collapse:collapse;
      font-size:13px;
      margin-top:10px;
    }

    .study-table th,
    .study-table td {
      border-bottom:1px solid rgba(255,255,255,.08);
      padding:8px;
      text-align:right;
      white-space:nowrap;
    }

    .study-table th:first-child,
    .study-table td:first-child {
      text-align:left;
    }

    .study-table th {
      color:#d1d5db;
      background:rgba(255,255,255,.06);
      font-weight:800;
    }

    .weekly-bars {
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:14px;
    }

    .weekly-bar-row {
      display:grid;
      grid-template-columns:76px 1fr 70px;
      gap:8px;
      align-items:center;
      font-size:12px;
    }

    .weekly-bar {
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.09);
      overflow:hidden;
    }

    .weekly-bar > div {
      height:100%;
      border-radius:inherit;
      background:var(--accent);
    }

    .week-detail {
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      font-size:13px;
      line-height:1.6;
    }

    .two-col {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media (max-width:980px) {
      body { padding:14px; }
      header { flex-direction:column; }
      .grid, .two-col { grid-template-columns:1fr; }
      .summary-controls { grid-template-columns:1fr; }
      .calendar-day { min-height:58px; padding:5px; }
      .study-table { font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>学習ログ確認ページ</h1>
        <div class="date" id="todayText"></div>
      </div>
      <button class="ghost" id="reloadBtn">再読み込み</button>
    </header>

    <div class="notice">
      これは本体アプリを壊さないための「確認専用ページ」です。<br>
      既存の <strong>focus_dashboard_v1</strong> のデータを読むだけで、タスク追加・削除・編集はしません。
    </div>

    <div class="grid">
      <section class="panel">
        <h2>カレンダー</h2>
        <div class="calendar-controls">
          <button class="ghost" id="prevMonthBtn">前月</button>
          <div class="calendar-title" id="calendarTitle"></div>
          <button class="ghost" id="nextMonthBtn">次月</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="detail" id="calendarDetail">日付をクリックすると、その日の学習内容が表示されます。</div>
      </section>

      <section class="panel">
        <h2>週別学習サマリー</h2>
        <div class="summary-controls">
          <select id="weekCountSelect">
            <option value="4">直近4週</option>
            <option value="8" selected>直近8週</option>
            <option value="12">直近12週</option>
            <option value="24">直近24週</option>
          </select>
          <select id="categoryFilter">
            <option value="all">全カテゴリ</option>
            <option value="TOEIC">TOEIC</option>
            <option value="ITパスポート">ITパスポート</option>
            <option value="大学課題">大学課題</option>
            <option value="筋トレ">筋トレ</option>
            <option value="読書">読書</option>
            <option value="その他">その他</option>
          </select>
          <button id="renderSummaryBtn">表示</button>
        </div>
        <div id="weeklySummary"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "focus_dashboard_v1";
    const $ = (id) => document.getElementById(id);

    let state = loadState();
    let calendarCursor = new Date();

    function defaultState() {
      return {
        tasks: [],
        sessions: [],
        reviews: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return {
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
          reviews: parsed.reviews || {}
        };
      } catch (e) {
        console.error(e);
        return defaultState();
      }
    }

    function todayKey() {
      return toDateKey(new Date());
    }

    function toDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = String(key).split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatMinutes(min) {
      min = Math.round(Number(min) || 0);
      if (min < 60) return `${min}分`;
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m ? `${h}時間${m}分` : `${h}時間`;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeCategory(cat) {
      const valid = ["TOEIC", "ITパスポート", "大学課題", "筋トレ", "読書", "その他"];
      return valid.includes(cat) ? cat : "その他";
    }

    function getSessionsForDate(dateKey, category = "all") {
      return state.sessions.filter(s => {
        const sameDate = s.date === dateKey;
        const sameCat = category === "all" || normalizeCategory(s.category) === category;
        return sameDate && sameCat;
      });
    }

    function getTasksForDate(dateKey) {
      return state.tasks.filter(t => t.date === dateKey);
    }

    function render() {
      state = loadState();
      $("todayText").textContent = new Date().toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      });
      renderCalendar();
      renderWeeklySummary();
    }

    function renderCalendar() {
      const grid = $("calendarGrid");
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();

      $("calendarTitle").textContent = `${year}年 ${month + 1}月`;

      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const startDay = first.getDay();

      const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
      let parts = dayNames.map(d => `<div class="calendar-day-name">${d}</div>`);

      for (let i = 0; i < startDay; i++) {
        parts.push(`<div class="calendar-day empty"></div>`);
      }

      for (let day = 1; day <= last.getDate(); day++) {
        const key = toDateKey(new Date(year, month, day));
        const sessions = getSessionsForDate(key);
        const tasks = getTasksForDate(key);
        const total = sessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
        const undone = tasks.filter(t => !t.done).length;

        parts.push(`
          <div class="calendar-day ${key === todayKey() ? "today" : ""}" onclick="showCalendarDetail('${key}')">
            <div class="calendar-num">${day}</div>
            ${total ? `<div class="calendar-min">${formatMinutes(total)}</div>` : `<div class="small">-</div>`}
            ${undone ? `<div class="calendar-task">未完了 ${undone}</div>` : ""}
          </div>
        `);
      }

      grid.innerHTML = parts.join("");
    }

    function showCalendarDetail(dateKey) {
      const sessions = getSessionsForDate(dateKey);
      const tasks = getTasksForDate(dateKey);
      const total = sessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);

      const byCategory = {};
      for (const s of sessions) {
        const cat = normalizeCategory(s.category);
        byCategory[cat] = (byCategory[cat] || 0) + (Number(s.minutes) || 0);
      }

      const categoryHtml = Object.entries(byCategory)
        .sort((a, b) => b[1] - a[1])
        .map(([cat, min]) => `<span class="mini-tag">${escapeHtml(cat)} ${formatMinutes(min)}</span>`)
        .join("");

      const sessionHtml = sessions.length
        ? sessions
            .sort((a, b) => String(a.endedAt || "").localeCompare(String(b.endedAt || "")))
            .map(s => `<div>・${escapeHtml(s.taskTitle || "記録")} / ${escapeHtml(normalizeCategory(s.category))} / ${formatMinutes(s.minutes)}</div>`)
            .join("")
        : `<div class="small">この日の記録はありません。</div>`;

      const taskHtml = tasks.length
        ? tasks.map(t => `<div>□ ${escapeHtml(t.title || "無題")} ${t.done ? "（完了）" : "（未完了）"}</div>`).join("")
        : `<div class="small">この日のタスクはありません。</div>`;

      const review = state.reviews?.[dateKey] || "";

      $("calendarDetail").innerHTML = `
        <strong>${dateKey}</strong><br>
        合計：${formatMinutes(total)}
        <div class="mini-tags">${categoryHtml}</div>
        <div style="margin-top:8px;"><strong>やったこと</strong>${sessionHtml}</div>
        <div style="margin-top:8px;"><strong>タスク</strong>${taskHtml}</div>
        ${review ? `<div style="margin-top:8px;"><strong>振り返り</strong><br>${escapeHtml(review)}</div>` : ""}
      `;
    }

    function changeCalendarMonth(offset) {
      calendarCursor.setMonth(calendarCursor.getMonth() + offset);
      renderCalendar();
    }

    function getWeekStartKey(dateKey) {
      const d = parseDateKey(dateKey);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return toDateKey(d);
    }

    function getWeekEndKey(weekStartKey) {
      const d = parseDateKey(weekStartKey);
      d.setDate(d.getDate() + 6);
      return toDateKey(d);
    }

    function getDateRange(startKey, endKey) {
      const result = [];
      const d = parseDateKey(startKey);
      const end = parseDateKey(endKey);
      while (d <= end) {
        result.push(toDateKey(d));
        d.setDate(d.getDate() + 1);
      }
      return result;
    }

    function getRecentWeekKeys(count) {
      const keys = [];
      const current = parseDateKey(getWeekStartKey(todayKey()));
      for (let i = 0; i < count; i++) {
        const d = new Date(current);
        d.setDate(d.getDate() - i * 7);
        keys.push(toDateKey(d));
      }
      return keys;
    }

    function renderWeeklySummary() {
      const count = Number($("weekCountSelect").value || 8);
      const categoryFilter = $("categoryFilter").value || "all";
      const cats = ["TOEIC", "ITパスポート", "大学課題", "筋トレ", "読書", "その他"];
      const weeks = getRecentWeekKeys(count);

      const rows = weeks.map(week => {
        const dates = getDateRange(week, getWeekEndKey(week));
        const sessions = state.sessions.filter(s => {
          const inWeek = dates.includes(s.date);
          const cat = normalizeCategory(s.category);
          const inCategory = categoryFilter === "all" || cat === categoryFilter;
          return inWeek && inCategory;
        });

        const row = { week, total: 0 };
        cats.forEach(c => row[c] = 0);

        sessions.forEach(s => {
          const cat = normalizeCategory(s.category);
          const minutes = Number(s.minutes) || 0;
          row[cat] += minutes;
          row.total += minutes;
        });

        row.sessions = sessions;
        return row;
      });

      const max = Math.max(60, ...rows.map(r => r.total));

      const table = `
        <table class="study-table">
          <thead>
            <tr>
              <th>週</th>
              <th>合計</th>
              <th>TOEIC</th>
              <th>IT</th>
              <th>大学</th>
              <th>筋トレ</th>
              <th>読書</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr onclick="showWeekDetail('${r.week}')" style="cursor:pointer;">
                <td>${r.week}</td>
                <td>${formatMinutes(r.total)}</td>
                <td>${formatMinutes(r["TOEIC"])}</td>
                <td>${formatMinutes(r["ITパスポート"])}</td>
                <td>${formatMinutes(r["大学課題"])}</td>
                <td>${formatMinutes(r["筋トレ"])}</td>
                <td>${formatMinutes(r["読書"])}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;

      const bars = `
        <div class="weekly-bars">
          ${rows.map(r => `
            <div class="weekly-bar-row">
              <div>${r.week.slice(5)}</div>
              <div class="weekly-bar">
                <div style="width:${Math.round((r.total / max) * 100)}%"></div>
              </div>
              <div>${formatMinutes(r.total)}</div>
            </div>
          `).join("")}
        </div>
      `;

      $("weeklySummary").innerHTML = table + bars + `<div class="week-detail" id="weekDetail">週をクリックすると詳細が表示されます。</div>`;
    }

    function showWeekDetail(weekStart) {
      const categoryFilter = $("categoryFilter").value || "all";
      const dates = getDateRange(weekStart, getWeekEndKey(weekStart));
      const sessions = state.sessions.filter(s => {
        const inWeek = dates.includes(s.date);
        const cat = normalizeCategory(s.category);
        const inCategory = categoryFilter === "all" || cat === categoryFilter;
        return inWeek && inCategory;
      });

      const total = sessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);

      const byDate = {};
      for (const s of sessions) {
        if (!byDate[s.date]) byDate[s.date] = [];
        byDate[s.date].push(s);
      }

      const html = dates.map(date => {
        const daySessions = byDate[date] || [];
        const dayTotal = daySessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
        return `
          <div style="margin-top:8px;">
            <strong>${date}：${formatMinutes(dayTotal)}</strong>
            ${daySessions.length
              ? daySessions.map(s => `<div>・${escapeHtml(s.taskTitle || "記録")} / ${escapeHtml(normalizeCategory(s.category))} / ${formatMinutes(s.minutes)}</div>`).join("")
              : `<div class="small">記録なし</div>`}
          </div>
        `;
      }).join("");

      const detail = document.getElementById("weekDetail");
      if (detail) {
        detail.innerHTML = `<strong>${weekStart} 〜 ${getWeekEndKey(weekStart)} / 合計 ${formatMinutes(total)}</strong>${html}`;
      }
    }

    $("prevMonthBtn").addEventListener("click", () => changeCalendarMonth(-1));
    $("nextMonthBtn").addEventListener("click", () => changeCalendarMonth(1));
    $("renderSummaryBtn").addEventListener("click", renderWeeklySummary);
    $("reloadBtn").addEventListener("click", render);
    $("weekCountSelect").addEventListener("change", renderWeeklySummary);
    $("categoryFilter").addEventListener("change", renderWeeklySummary);

    window.showCalendarDetail = showCalendarDetail;
    window.showWeekDetail = showWeekDetail;

    render();
  </script>
</body>
</html>
