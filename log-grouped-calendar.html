<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>集中ログ・カレンダー</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --purple: #a78bfa;
      --radius: 18px;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.16), transparent 35%),
        radial-gradient(circle at bottom right, rgba(167,139,250,.14), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 22px;
    }

    .app { max-width: 1220px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    h3 { margin: 14px 0 8px; font-size: 15px; }
    .small { color: var(--muted); font-size: 13px; line-height: 1.55; }

    button, input, select { font: inherit; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 9px 12px;
      color: #07111f;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.ok { background: var(--ok); color: #052e22; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(15,23,42,.78);
      color: var(--text);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: .95fr 1.05fr;
      gap: 18px;
      align-items: start;
    }
    .panel {
      background: rgba(17, 24, 39, .90);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .calendar-title { font-weight: 900; font-size: 18px; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .weekday {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 4px 0;
    }
    .day {
      min-height: 82px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      border-radius: 14px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .day:hover { border-color: rgba(56,189,248,.55); }
    .day.empty { visibility: hidden; }
    .day.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,.18); }
    .day.today { background: rgba(56,189,248,.08); }
    .day-num { font-weight: 900; font-size: 13px; }
    .day-min { color: var(--accent); font-weight: 900; font-size: 13px; margin-top: auto; }
    .day-dots { display: flex; flex-wrap: wrap; gap: 4px; }
    .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--muted); }
    .dot.toeic { background: #38bdf8; }
    .dot.it { background: #a78bfa; }
    .dot.univ { background: #fbbf24; }
    .dot.gym { background: #34d399; }
    .dot.read { background: #f472b6; }
    .dot.other { background: #94a3b8; }

    .summary-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
    .pill {
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: #e5e7eb;
    }
    .pill.strong { color: #07111f; background: var(--accent); border-color: transparent; font-weight: 900; }

    .group-list, .task-list, .week-list { display: flex; flex-direction: column; gap: 9px; }
    .group-item {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      border-radius: 14px;
      padding: 11px;
    }
    .group-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }
    .group-title { font-weight: 900; line-height: 1.35; }
    .group-time { color: var(--accent); font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .group-meta { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.45; }
    .group-note { color: #d1d5db; font-size: 12px; margin-top: 7px; line-height: 1.5; white-space: pre-wrap; }

    .task-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      border-radius: 12px;
      padding: 9px;
      font-size: 13px;
    }
    .check { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--muted); }
    .check.done { background: var(--ok); border-color: var(--ok); }
    .task-status { color: var(--muted); font-size: 12px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar > * { width: auto; }
    .week-card {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      border-radius: 14px;
      padding: 12px;
    }
    .week-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .muted { color: var(--muted); }

    @media (max-width: 980px) {
      body { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .day { min-height: 74px; }
      .calendar-grid { gap: 6px; }
      .toolbar > * { width: 100%; }
      .group-head { grid-template-columns: 1fr; }
      .group-time { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>集中ログ・カレンダー</h1>
        <div class="small">やったことは同じタイトルごとにまとめて表示します。</div>
      </div>
      <div class="toolbar">
        <button class="ghost" id="prevMonthBtn">前の月</button>
        <button class="ghost" id="todayBtn">今日</button>
        <button class="ghost" id="nextMonthBtn">次の月</button>
      </div>
    </header>

    <div class="grid">
      <section class="panel">
        <div class="calendar-head">
          <div class="calendar-title" id="calendarTitle"></div>
          <div class="small" id="monthTotal"></div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <section class="panel">
        <h2 id="selectedTitle">日別ログ</h2>
        <div class="summary-row" id="daySummary"></div>

        <h3>やったこと</h3>
        <div class="small" style="margin-bottom:8px;">同じカテゴリ・同じタイトルは合算しています。</div>
        <div class="group-list" id="sessionGroups"></div>

        <h3>タスク</h3>
        <div class="task-list" id="taskList"></div>
      </section>
    </div>

    <section class="panel" style="margin-top:18px;">
      <h2>週別サマリー</h2>
      <div class="small" style="margin-bottom:10px;">週ごとの合計も、カテゴリ・タイトル別にまとめます。</div>
      <div class="week-list" id="weeklyList"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "focus_dashboard_v1";
    let state = loadState();
    let selectedDate = todayKey();
    let currentMonth = new Date();

    const $ = (id) => document.getElementById(id);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { tasks: [], sessions: [], reviews: {} };
        const parsed = JSON.parse(raw);
        return {
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
          reviews: parsed.reviews || {}
        };
      } catch {
        return { tasks: [], sessions: [], reviews: {} };
      }
    }

    function todayKey() {
      const d = new Date();
      return toDateKey(d);
    }

    function toDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatMinutes(min) {
      min = Number(min || 0);
      if (min < 60) return `${min}分`;
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m === 0 ? `${h}時間` : `${h}時間${m}分`;
    }

    function normalizeTitle(title) {
      return String(title || "未選択")
        .replace(/\s+/g, " ")
        .trim();
    }

    function categoryClass(category) {
      if (category === "TOEIC") return "toeic";
      if (category === "ITパスポート") return "it";
      if (category === "大学課題") return "univ";
      if (category === "筋トレ") return "gym";
      if (category === "読書") return "read";
      return "other";
    }

    function sessionsByDate(dateKey) {
      return state.sessions.filter(s => s.date === dateKey);
    }

    function tasksByDate(dateKey) {
      return state.tasks.filter(t => t.date === dateKey);
    }

    function groupSessions(sessions) {
      const map = new Map();
      for (const s of sessions) {
        const category = s.category || "その他";
        const title = normalizeTitle(s.taskTitle || s.title || "未選択");
        const key = `${category}|||${title}`;
        if (!map.has(key)) {
          map.set(key, {
            category,
            title,
            minutes: 0,
            count: 0,
            notes: [],
            manual: false
          });
        }
        const item = map.get(key);
        item.minutes += Number(s.minutes || 0);
        item.count += 1;
        if (s.note) item.notes.push(s.note);
        if (s.type === "manual") item.manual = true;
      }
      return Array.from(map.values()).sort((a, b) => b.minutes - a.minutes || a.title.localeCompare(b.title, "ja"));
    }

    function sumByCategory(sessions) {
      const map = {};
      for (const s of sessions) {
        const cat = s.category || "その他";
        map[cat] = (map[cat] || 0) + Number(s.minutes || 0);
      }
      return Object.entries(map).sort((a,b) => b[1] - a[1]);
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      $("calendarTitle").textContent = `${year}年${month + 1}月`;

      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const startBlank = first.getDay();
      const cells = [];

      const monthPrefix = `${year}-${String(month + 1).padStart(2, "0")}`;
      const monthSessions = state.sessions.filter(s => String(s.date || "").startsWith(monthPrefix));
      const monthTotal = monthSessions.reduce((sum, s) => sum + Number(s.minutes || 0), 0);
      $("monthTotal").textContent = `月合計：${formatMinutes(monthTotal)}`;

      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      for (const w of weekdays) cells.push(`<div class="weekday">${w}</div>`);
      for (let i = 0; i < startBlank; i++) cells.push(`<div class="day empty"></div>`);

      for (let day = 1; day <= last.getDate(); day++) {
        const date = new Date(year, month, day);
        const key = toDateKey(date);
        const sessions = sessionsByDate(key);
        const total = sessions.reduce((sum, s) => sum + Number(s.minutes || 0), 0);
        const categories = [...new Set(sessions.map(s => s.category || "その他"))].slice(0, 6);
        const dots = categories.map(cat => `<span class="dot ${categoryClass(cat)}"></span>`).join("");
        const cls = ["day"];
        if (key === selectedDate) cls.push("selected");
        if (key === todayKey()) cls.push("today");
        cells.push(`
          <div class="${cls.join(" ")}" data-date="${key}">
            <div class="day-num">${day}</div>
            <div class="day-dots">${dots}</div>
            <div class="day-min">${total ? formatMinutes(total) : ""}</div>
          </div>
        `);
      }

      $("calendarGrid").innerHTML = cells.join("");
      document.querySelectorAll(".day[data-date]").forEach(el => {
        el.addEventListener("click", () => {
          selectedDate = el.dataset.date;
          render();
        });
      });
    }

    function renderSelectedDay() {
      const sessions = sessionsByDate(selectedDate);
      const tasks = tasksByDate(selectedDate);
      const total = sessions.reduce((sum, s) => sum + Number(s.minutes || 0), 0);
      const groups = groupSessions(sessions);
      const byCat = sumByCategory(sessions);
      const done = tasks.filter(t => t.done).length;

      $("selectedTitle").textContent = `${selectedDate} のログ`;
      const summary = [
        `<span class="pill strong">合計：${formatMinutes(total)}</span>`,
        `<span class="pill">記録：${sessions.length}件 → ${groups.length}項目に集約</span>`,
        `<span class="pill">タスク：${done}/${tasks.length} 完了</span>`
      ].concat(byCat.map(([cat, min]) => `<span class="pill">${escapeHtml(cat)} ${formatMinutes(min)}</span>`));
      $("daySummary").innerHTML = summary.join("");

      if (groups.length === 0) {
        $("sessionGroups").innerHTML = `<div class="small">この日の記録はありません。</div>`;
      } else {
        $("sessionGroups").innerHTML = groups.map(g => `
          <div class="group-item">
            <div class="group-head">
              <div>
                <div class="group-title">${escapeHtml(g.title)}</div>
                <div class="group-meta">${escapeHtml(g.category)} / ${g.count}件を合算${g.manual ? " / 手動ログ含む" : ""}</div>
              </div>
              <div class="group-time">${formatMinutes(g.minutes)}</div>
            </div>
            ${g.notes.length ? `<div class="group-note">${escapeHtml(g.notes.slice(0, 3).join("\n"))}</div>` : ""}
          </div>
        `).join("");
      }

      if (tasks.length === 0) {
        $("taskList").innerHTML = `<div class="small">この日のタスクはありません。</div>`;
      } else {
        $("taskList").innerHTML = tasks
          .sort((a,b) => Number(a.done) - Number(b.done) || String(a.category).localeCompare(String(b.category), "ja"))
          .map(t => `
            <div class="task-row">
              <div class="check ${t.done ? "done" : ""}"></div>
              <div>
                <strong>${escapeHtml(t.title)}</strong>
                <div class="small">${escapeHtml(t.category || "その他")}${t.deadline ? ` / 締切 ${escapeHtml(t.deadline)}` : ""}</div>
              </div>
              <div class="task-status">${t.done ? "完了" : "未完了"}</div>
            </div>
          `).join("");
      }
    }

    function getWeekStartKey(dateKey) {
      const d = parseDateKey(dateKey);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return toDateKey(d);
    }

    function getWeekEndKey(weekStartKey) {
      const d = parseDateKey(weekStartKey);
      d.setDate(d.getDate() + 6);
      return toDateKey(d);
    }

    function renderWeekly() {
      const monthPrefix = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, "0")}`;
      const monthSessions = state.sessions.filter(s => String(s.date || "").startsWith(monthPrefix));
      const weekMap = new Map();
      for (const s of monthSessions) {
        const wk = getWeekStartKey(s.date);
        if (!weekMap.has(wk)) weekMap.set(wk, []);
        weekMap.get(wk).push(s);
      }

      const weeks = Array.from(weekMap.entries()).sort((a,b) => b[0].localeCompare(a[0]));
      if (weeks.length === 0) {
        $("weeklyList").innerHTML = `<div class="small">この月の記録はありません。</div>`;
        return;
      }

      $("weeklyList").innerHTML = weeks.map(([weekStart, sessions]) => {
        const weekEnd = getWeekEndKey(weekStart);
        const total = sessions.reduce((sum, s) => sum + Number(s.minutes || 0), 0);
        const groups = groupSessions(sessions).slice(0, 8);
        const cats = sumByCategory(sessions).map(([cat, min]) => `<span class="pill">${escapeHtml(cat)} ${formatMinutes(min)}</span>`).join("");
        return `
          <div class="week-card">
            <div class="week-head">
              <strong>${weekStart} 〜 ${weekEnd}</strong>
              <strong style="color:var(--accent);">${formatMinutes(total)}</strong>
            </div>
            <div class="summary-row">${cats}</div>
            <div class="group-list">
              ${groups.map(g => `
                <div class="group-item">
                  <div class="group-head">
                    <div>
                      <div class="group-title">${escapeHtml(g.title)}</div>
                      <div class="group-meta">${escapeHtml(g.category)} / ${g.count}件を合算</div>
                    </div>
                    <div class="group-time">${formatMinutes(g.minutes)}</div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    function render() {
      renderCalendar();
      renderSelectedDay();
      renderWeekly();
    }

    $("prevMonthBtn").addEventListener("click", () => {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
      render();
    });
    $("nextMonthBtn").addEventListener("click", () => {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
      render();
    });
    $("todayBtn").addEventListener("click", () => {
      selectedDate = todayKey();
      currentMonth = new Date();
      render();
    });

    render();
  </script>
</body>
</html>
