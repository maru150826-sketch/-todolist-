<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>集中ダッシュボード</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #38bdf8;
      --danger: #fb7185;
      --ok: #34d399;
      --warn: #fbbf24;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(251,113,133,.14), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: .04em;
    }

    .date {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
    }

    .panel {
      background: rgba(17, 24, 39, .88);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .main-task {
      border: 1px solid rgba(56,189,248,.45);
      background: rgba(56,189,248,.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .main-task-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .main-task-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.4;
      min-height: 34px;
    }

    .quote {
      color: #d1d5db;
      background: rgba(255,255,255,.05);
      border-left: 4px solid var(--accent);
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .timer {
      text-align: center;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.08);
    }

    .mode {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .time {
      font-size: 82px;
      font-weight: 900;
      letter-spacing: .02em;
      line-height: 1;
      margin: 14px 0;
      font-variant-numeric: tabular-nums;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      color: #07111f;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease;
    }

    button:hover {
      opacity: .92;
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #e5e7eb;
    }

    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.danger {
      background: var(--danger);
      color: white;
    }

    button.ok {
      background: var(--ok);
      color: #052e22;
    }

    button.warn {
      background: var(--warn);
      color: #352600;
    }

    .timer-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .row.wrap {
      flex-wrap: wrap;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      background: rgba(15,23,42,.78);
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .add-task {
      display: grid;
      grid-template-columns: 1.5fr .7fr .7fr auto;
      gap: 8px;
      margin-bottom: 14px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }

    .task.done {
      opacity: .62;
    }

    .task.done .task-title {
      text-decoration: line-through;
    }

    .task-title {
      font-weight: 800;
      line-height: 1.35;
    }

    .task-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .task-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .task-actions button {
      padding: 7px 9px;
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 12px;
    }

    .stat .value {
      font-size: 24px;
      font-weight: 900;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .progress-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category {
      display: grid;
      grid-template-columns: 110px 1fr 68px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: inherit;
    }

    .debt-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .debt {
      border: 1px solid rgba(251,191,36,.25);
      background: rgba(251,191,36,.08);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .review {
      display: grid;
      gap: 10px;
    }

    .history {
      max-height: 260px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      font-size: 13px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      padding: 24px;
    }

    .overlay.show {
      display: flex;
    }

    .alarm-box {
      max-width: 620px;
      width: 100%;
      text-align: center;
      background: #111827;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .alarm-box h2 {
      font-size: 34px;
      margin: 0 0 8px;
    }

    .alarm-box p {
      color: #d1d5db;
      line-height: 1.7;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 12px;
    }


    .review-dashboard {
      display: grid;
      gap: 10px;
    }

    .review-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .summary-card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 10px;
    }

    .summary-card strong {
      display: block;
      font-size: 20px;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .day-review {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,.04);
    }

    .day-review-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .day-review-title {
      font-weight: 900;
    }

    .day-review-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .mini-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .mini-tag {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.05);
      color: #d1d5db;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
    }

    .review-note {
      color: #e5e7eb;
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-wrap;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      body {
        padding: 14px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .add-task {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .settings {
        grid-template-columns: 1fr 1fr;
      }

      .time {
        font-size: 58px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>集中ダッシュボード</h1>
        <div class="date" id="todayText"></div>
      </div>
      <div class="top-actions">
        <button class="ghost" id="exportBtn">データ出力</button>
        <button class="ghost" id="importBtn">データ読込</button>
        <button class="danger" id="resetDataBtn">全データ削除</button>
        <input class="hidden" type="file" id="importFile" accept=".json" />
      </div>
    </header>

    <div class="grid">
      <main class="panel">
        <section class="main-task">
          <div class="main-task-label">今やること</div>
          <div class="main-task-title" id="currentTaskTitle">タスクを選んでください</div>
        </section>

        <div class="quote" id="quoteBox"></div>

        <section class="timer">
          <div class="mode" id="modeText">集中</div>
          <div class="time" id="timeText">25:00</div>
          <div class="small" id="timerHint">開始すると、選択中のタスクに集中時間が記録されます。</div>
          <div class="timer-actions">
            <button id="startPauseBtn">開始</button>
            <button class="secondary" id="shortBreakBtn">5分休憩</button>
            <button class="secondary" id="longBreakBtn">15分休憩</button>
            <button class="ghost" id="resetTimerBtn">リセット</button>
          </div>
          <div class="settings">
            <input type="number" id="focusMin" min="1" max="180" value="25" title="集中時間" />
            <input type="number" id="breakMin" min="1" max="60" value="5" title="短い休憩" />
            <input type="number" id="longBreakMin" min="1" max="120" value="15" title="長い休憩" />
            <select id="alarmType" title="アラーム音">
              <option value="urgent">強め</option>
              <option value="bell">ベル</option>
              <option value="siren">サイレン</option>
              <option value="retro">レトロ</option>
              <option value="soft">控えめ</option>
            </select>
            <button class="ghost" id="saveSettingsBtn">保存</button>
          </div>
          <div class="small">左から：集中分数 / 短い休憩 / 長い休憩 / アラーム音</div>
        </section>

        <section style="margin-top:18px;">
          <h2>今日のタスク</h2>
          <div class="add-task">
            <input id="taskInput" placeholder="例：TOEIC Part 7 精読" />
            <select id="categoryInput">
              <option value="TOEIC">TOEIC</option>
              <option value="ITパスポート">ITパスポート</option>
              <option value="大学課題">大学課題</option>
              <option value="筋トレ">筋トレ</option>
              <option value="その他">その他</option>
            </select>
            <select id="priorityInput">
              <option value="high">最重要</option>
              <option value="normal">普通</option>
              <option value="low">軽め</option>
            </select>
            <button id="addTaskBtn">追加</button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </main>

      <aside>
        <section class="panel">
          <h2>今日の進捗</h2>
          <div class="stats">
            <div class="stat">
              <div class="small">今日の集中</div>
              <div class="value" id="todayFocus">0分</div>
            </div>
            <div class="stat">
              <div class="small">完了タスク</div>
              <div class="value" id="doneCount">0</div>
            </div>
            <div class="stat">
              <div class="small">連続記録</div>
              <div class="value" id="streakCount">0日</div>
            </div>
          </div>
          <div class="progress-table" id="categoryProgress"></div>
        </section>

        <section class="panel" style="margin-top:18px;">
          <h2>放置タスク</h2>
          <div class="small" style="margin-bottom:10px;">2日以上未完了のタスクを表示します。</div>
          <div class="debt-list" id="debtList"></div>
        </section>

        <section class="panel" style="margin-top:18px;">
          <h2>今日の振り返り</h2>
          <div class="review">
            <textarea id="reviewText" placeholder="例：今日はPart 7を逃げずにできた。明日は最初にITパスポートをやる。"></textarea>
            <button class="ok" id="saveReviewBtn">振り返り保存</button>
          </div>
        </section>

        <section class="panel" style="margin-top:18px;">
          <h2>履歴</h2>
          <div class="history" id="historyList"></div>
        </section>

        <section class="panel" style="margin-top:18px;">
          <h2>振り返り分析</h2>
          <div class="review-dashboard">
            <div class="review-controls">
              <select id="reviewRange">
                <option value="7">直近7日</option>
                <option value="30">直近30日</option>
                <option value="all">全期間</option>
              </select>
              <select id="reviewCategory">
                <option value="all">全カテゴリ</option>
                <option value="TOEIC">TOEIC</option>
                <option value="ITパスポート">ITパスポート</option>
                <option value="大学課題">大学課題</option>
                <option value="筋トレ">筋トレ</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <div class="summary-cards">
              <div class="summary-card">
                <div class="small">期間合計</div>
                <strong id="reviewTotal">0分</strong>
              </div>
              <div class="summary-card">
                <div class="small">集中日数</div>
                <strong id="reviewDays">0日</strong>
              </div>
              <div class="summary-card">
                <div class="small">最高日</div>
                <strong id="reviewBest">0分</strong>
              </div>
            </div>
            <div class="history" id="reviewTimeline"></div>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <div class="overlay" id="alarmOverlay">
    <div class="alarm-box">
      <h2 id="alarmTitle">終了</h2>
      <p id="alarmMessage">ボタンを押すまで音は止まりません。</p>
      <button class="danger" id="stopAlarmBtn">音を止める</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "focus_dashboard_v1";

    const quotes = [
      "今やることを一つに絞れ。集中はそこから始まる。",
      "25分だけでいい。まず流れを作る。",
      "今日の勝ちは、開始した回数で決まる。",
      "考えすぎる前に、最初の一手を打つ。",
      "集中は気合いではなく、余計な選択肢を消すこと。",
      "未来の自分に回すな。今の自分が少し片づけろ。",
      "完璧な日より、崩れなかった日を増やせ。",
      "やることを減らせ。深くやれ。",
      "始める前の迷いに価値はない。始めた後に修正しろ。",
      "今日の一番重いタスクを、最初に動かせ。"
    ];

    let state = loadState();
    let timer = {
      mode: "focus",
      secondsLeft: state.settings.focusMin * 60,
      running: false,
      startedAt: null,
      intervalId: null
    };

    let alarm = {
      audioContext: null,
      intervalId: null
    };

    const $ = (id) => document.getElementById(id);

    function todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function dateLabel() {
      const d = new Date();
      return d.toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      });
    }

    function defaultState() {
      return {
        tasks: [],
        currentTaskId: null,
        sessions: [],
        reviews: {},
        settings: {
          focusMin: 25,
          breakMin: 5,
          longBreakMin: 15,
          alarmType: "urgent"
        },
        lastOpenedDate: todayKey()
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return defaultState();
        const parsed = JSON.parse(saved);
        return { ...defaultState(), ...parsed, settings: { ...defaultState().settings, ...(parsed.settings || {}) } };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function migrateDateIfNeeded() {
      const today = todayKey();
      if (state.lastOpenedDate !== today) {
        state.lastOpenedDate = today;
        state.currentTaskId = null;
        saveState();
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function formatMinutes(min) {
      if (min < 60) return `${min}分`;
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m === 0 ? `${h}時間` : `${h}時間${m}分`;
    }

    function todayTasks() {
      return state.tasks.filter(t => t.date === todayKey());
    }

    function todaySessions() {
      return state.sessions.filter(s => s.date === todayKey());
    }

    function currentTask() {
      return state.tasks.find(t => t.id === state.currentTaskId) || null;
    }

    function addTask() {
      const title = $("taskInput").value.trim();
      if (!title) return;

      const task = {
        id: crypto.randomUUID(),
        title,
        category: $("categoryInput").value,
        priority: $("priorityInput").value,
        done: false,
        date: todayKey(),
        createdAt: new Date().toISOString(),
        completedAt: null
      };

      state.tasks.unshift(task);
      if (!state.currentTaskId) state.currentTaskId = task.id;
      $("taskInput").value = "";
      saveState();
      render();
    }

    function setCurrentTask(id) {
      state.currentTaskId = id;
      saveState();
      render();
    }

    function toggleDone(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      task.done = !task.done;
      task.completedAt = task.done ? new Date().toISOString() : null;
      saveState();
      render();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      if (state.currentTaskId === id) state.currentTaskId = null;
      saveState();
      render();
    }

    function renderTasks() {
      const list = $("taskList");
      const tasks = todayTasks().sort((a, b) => {
        const order = { high: 0, normal: 1, low: 2 };
        return order[a.priority] - order[b.priority];
      });

      if (tasks.length === 0) {
        list.innerHTML = `<div class="small">今日のタスクがありません。まず3つだけ追加してください。</div>`;
        return;
      }

      list.innerHTML = tasks.map(task => {
        const selected = task.id === state.currentTaskId ? "選択中" : "選ぶ";
        const priorityText = task.priority === "high" ? "最重要" : task.priority === "normal" ? "普通" : "軽め";
        return `
          <div class="task ${task.done ? "done" : ""}">
            <input type="checkbox" ${task.done ? "checked" : ""} onchange="toggleDone('${task.id}')" />
            <div>
              <div class="task-title">${escapeHtml(task.title)}</div>
              <div class="task-meta">${escapeHtml(task.category)} / ${priorityText}</div>
            </div>
            <div class="task-actions">
              <button class="${task.id === state.currentTaskId ? "ok" : "ghost"}" onclick="setCurrentTask('${task.id}')">${selected}</button>
              <button class="danger" onclick="deleteTask('${task.id}')">削除</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderCurrentTask() {
      const task = currentTask();
      $("currentTaskTitle").textContent = task ? task.title : "タスクを選んでください";
    }

    function getTaskMinutes(taskId, date = todayKey()) {
      return state.sessions
        .filter(s => s.taskId === taskId && s.date === date)
        .reduce((sum, s) => sum + s.minutes, 0);
    }

    function renderStats() {
      const sessions = todaySessions();
      const total = sessions.reduce((sum, s) => sum + s.minutes, 0);
      const done = todayTasks().filter(t => t.done).length;
      $("todayFocus").textContent = formatMinutes(total);
      $("doneCount").textContent = String(done);
      $("streakCount").textContent = `${calculateStreak()}日`;

      const categories = ["TOEIC", "ITパスポート", "大学課題", "筋トレ", "その他"];
      const max = Math.max(60, ...categories.map(cat =>
        sessions.filter(s => s.category === cat).reduce((sum, s) => sum + s.minutes, 0)
      ));

      $("categoryProgress").innerHTML = categories.map(cat => {
        const min = sessions.filter(s => s.category === cat).reduce((sum, s) => sum + s.minutes, 0);
        const pct = Math.min(100, Math.round((min / max) * 100));
        return `
          <div class="category">
            <div>${cat}</div>
            <div class="bar"><div style="width:${pct}%"></div></div>
            <div>${formatMinutes(min)}</div>
          </div>
        `;
      }).join("");
    }

    function calculateStreak() {
      const days = new Set(state.sessions.filter(s => s.minutes > 0).map(s => s.date));
      let streak = 0;
      const d = new Date();

      while (true) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        const key = `${y}-${m}-${day}`;
        if (days.has(key)) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function renderDebt() {
      const now = new Date();
      const debts = state.tasks
        .filter(t => !t.done)
        .map(t => {
          const days = Math.floor((now - new Date(t.createdAt)) / (1000 * 60 * 60 * 24));
          return { ...t, days };
        })
        .filter(t => t.days >= 2)
        .sort((a, b) => b.days - a.days);

      const box = $("debtList");
      if (debts.length === 0) {
        box.innerHTML = `<div class="small">放置タスクはありません。</div>`;
        return;
      }

      box.innerHTML = debts.map(t => `
        <div class="debt">
          <strong>${escapeHtml(t.title)}</strong><br />
          ${escapeHtml(t.category)} / ${t.days}日放置
        </div>
      `).join("");
    }

    function renderHistory() {
      const history = [...state.sessions].sort((a, b) => new Date(b.endedAt) - new Date(a.endedAt)).slice(0, 20);
      const box = $("historyList");

      if (history.length === 0) {
        box.innerHTML = `<div class="small">まだ履歴はありません。</div>`;
        return;
      }

      box.innerHTML = history.map(s => `
        <div class="history-item">
          <strong>${escapeHtml(s.taskTitle || "休憩/未選択")}</strong><br />
          ${s.date} / ${escapeHtml(s.category || "その他")} / ${formatMinutes(s.minutes)}
        </div>
      `).join("");
    }

    function renderReview() {
      $("reviewText").value = state.reviews[todayKey()] || "";
    }


    function getDatesForReview(range) {
      const dates = new Set([
        ...state.sessions.map(s => s.date),
        ...state.tasks.map(t => t.date),
        ...Object.keys(state.reviews || {})
      ]);

      let list = Array.from(dates).sort((a, b) => b.localeCompare(a));

      if (range !== "all") {
        const limit = Number(range);
        const start = new Date();
        start.setDate(start.getDate() - (limit - 1));
        const startKey = [
          start.getFullYear(),
          String(start.getMonth() + 1).padStart(2, "0"),
          String(start.getDate()).padStart(2, "0")
        ].join("-");
        list = list.filter(d => d >= startKey);
      }

      return list;
    }

    function renderReviewDashboard() {
      const rangeEl = $("reviewRange");
      const categoryEl = $("reviewCategory");
      if (!rangeEl || !categoryEl) return;

      const range = rangeEl.value || "7";
      const category = categoryEl.value || "all";
      const dates = getDatesForReview(range);

      const sessions = state.sessions.filter(s => {
        const inDate = dates.includes(s.date);
        const inCategory = category === "all" || s.category === category;
        return inDate && inCategory;
      });

      const total = sessions.reduce((sum, s) => sum + s.minutes, 0);
      const focusedDays = new Set(sessions.map(s => s.date)).size;

      const totalsByDay = {};
      for (const s of sessions) {
        totalsByDay[s.date] = (totalsByDay[s.date] || 0) + s.minutes;
      }
      const bestMinutes = Object.values(totalsByDay).length ? Math.max(...Object.values(totalsByDay)) : 0;

      $("reviewTotal").textContent = formatMinutes(total);
      $("reviewDays").textContent = `${focusedDays}日`;
      $("reviewBest").textContent = formatMinutes(bestMinutes);

      const timeline = $("reviewTimeline");
      if (dates.length === 0) {
        timeline.innerHTML = `<div class="small">まだ振り返りデータがありません。</div>`;
        return;
      }

      const rows = dates.map(date => {
        const daySessions = state.sessions.filter(s => {
          const inCategory = category === "all" || s.category === category;
          return s.date === date && inCategory;
        });

        const dayTasks = state.tasks.filter(t => {
          const inCategory = category === "all" || t.category === category;
          return t.date === date && inCategory;
        });

        const dayTotal = daySessions.reduce((sum, s) => sum + s.minutes, 0);
        const done = dayTasks.filter(t => t.done).length;
        const all = dayTasks.length;

        const byCategory = {};
        for (const s of daySessions) {
          byCategory[s.category] = (byCategory[s.category] || 0) + s.minutes;
        }

        const tags = Object.entries(byCategory)
          .sort((a, b) => b[1] - a[1])
          .map(([cat, min]) => `<span class="mini-tag">${escapeHtml(cat)} ${formatMinutes(min)}</span>`)
          .join("");

        const review = state.reviews[date] || "";
        const sessionTitles = daySessions.slice(0, 4)
          .map(s => `<span class="mini-tag">${escapeHtml(s.taskTitle || "未選択")}</span>`)
          .join("");

        return `
          <div class="day-review">
            <div class="day-review-head">
              <div class="day-review-title">${date}</div>
              <div class="day-review-meta">${formatMinutes(dayTotal)} / 完了 ${done}/${all}</div>
            </div>
            <div class="mini-tags">${tags || `<span class="mini-tag">集中記録なし</span>`}</div>
            <div class="mini-tags">${sessionTitles}</div>
            ${review ? `<div class="review-note">${escapeHtml(review)}</div>` : `<div class="small">振り返りメモなし</div>`}
          </div>
        `;
      }).join("");

      timeline.innerHTML = rows;
    }

    function renderQuote() {
      const index = Math.abs(hashCode(todayKey())) % quotes.length;
      $("quoteBox").textContent = quotes[index];
    }

    function renderTimer() {
      $("timeText").textContent = formatTime(timer.secondsLeft);
      $("modeText").textContent = timer.mode === "focus" ? "集中" : "休憩";
      $("startPauseBtn").textContent = timer.running ? "一時停止" : "開始";
    }

    function renderSettings() {
      $("focusMin").value = state.settings.focusMin;
      $("breakMin").value = state.settings.breakMin;
      $("longBreakMin").value = state.settings.longBreakMin;
      $("alarmType").value = state.settings.alarmType || "urgent";
    }

    function render() {
      $("todayText").textContent = dateLabel();
      renderCurrentTask();
      renderTasks();
      renderStats();
      renderDebt();
      renderHistory();
      renderReviewDashboard();
      renderQuote();
      renderTimer();
      renderSettings();
    }

    function startPauseTimer() {
      if (timer.running) {
        pauseTimer();
        return;
      }

      if (timer.mode === "focus" && !currentTask()) {
        alert("先にタスクを選んでください。");
        return;
      }

      timer.running = true;
      timer.startedAt = new Date();
      timer.intervalId = setInterval(tick, 1000);
      renderTimer();
    }

    function pauseTimer() {
      timer.running = false;
      clearInterval(timer.intervalId);
      timer.intervalId = null;
      renderTimer();
    }

    function tick() {
      timer.secondsLeft--;
      if (timer.secondsLeft <= 0) {
        finishTimer();
      }
      renderTimer();
    }

    function finishTimer() {
      clearInterval(timer.intervalId);
      timer.running = false;

      if (timer.mode === "focus") {
        const task = currentTask();
        const minutes = state.settings.focusMin;
        state.sessions.push({
          id: crypto.randomUUID(),
          date: todayKey(),
          taskId: task ? task.id : null,
          taskTitle: task ? task.title : "未選択",
          category: task ? task.category : "その他",
          minutes,
          endedAt: new Date().toISOString()
        });
        saveState();
        showAlarm("集中終了", "1セット完了。休憩するか、次の25分に入ってください。");
        timer.mode = "break";
        timer.secondsLeft = state.settings.breakMin * 60;
      } else {
        showAlarm("休憩終了", "戻れ。次のタスクに入る時間です。");
        timer.mode = "focus";
        timer.secondsLeft = state.settings.focusMin * 60;
      }

      render();
    }

    function resetTimer() {
      pauseTimer();
      timer.mode = "focus";
      timer.secondsLeft = state.settings.focusMin * 60;
      renderTimer();
    }

    function setBreak(long = false) {
      pauseTimer();
      timer.mode = "break";
      timer.secondsLeft = (long ? state.settings.longBreakMin : state.settings.breakMin) * 60;
      renderTimer();
    }

    function saveSettings() {
      state.settings.focusMin = clamp(Number($("focusMin").value), 1, 180);
      state.settings.breakMin = clamp(Number($("breakMin").value), 1, 60);
      state.settings.longBreakMin = clamp(Number($("longBreakMin").value), 1, 120);
      state.settings.alarmType = $("alarmType").value || "urgent";
      saveState();
      resetTimer();
      render();
    }

    function showAlarm(title, message) {
      $("alarmTitle").textContent = title;
      $("alarmMessage").textContent = message + " ボタンを押すまで音は止まりません。";
      $("alarmOverlay").classList.add("show");
      startAlarmSound();
    }

    function startAlarmSound() {
      stopAlarmSound();
      alarm.audioContext = new (window.AudioContext || window.webkitAudioContext)();

      const type = state.settings.alarmType || "urgent";

      const playTone = (frequency, startOffset, duration, wave = "square", volume = 0.35) => {
        const ctx = alarm.audioContext;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = wave;
        osc.frequency.setValueAtTime(frequency, ctx.currentTime + startOffset);
        gain.gain.setValueAtTime(0.001, ctx.currentTime + startOffset);
        gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + startOffset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startOffset + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + startOffset);
        osc.stop(ctx.currentTime + startOffset + duration + 0.02);
      };

      const patterns = {
        urgent: () => {
          playTone(880, 0.00, 0.25, "square", 0.38);
          playTone(1175, 0.30, 0.25, "square", 0.38);
          playTone(880, 0.60, 0.25, "square", 0.38);
        },
        bell: () => {
          playTone(1046, 0.00, 0.55, "sine", 0.32);
          playTone(1318, 0.08, 0.45, "sine", 0.22);
          playTone(1568, 0.16, 0.35, "sine", 0.15);
        },
        siren: () => {
          const ctx = alarm.audioContext;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(1200, ctx.currentTime + 0.45);
          osc.frequency.linearRampToValueAtTime(520, ctx.currentTime + 0.9);

          gain.gain.setValueAtTime(0.001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.95);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1.0);
        },
        retro: () => {
          playTone(660, 0.00, 0.12, "square", 0.30);
          playTone(0.001, 0.14, 0.02, "square", 0.01);
          playTone(880, 0.18, 0.12, "square", 0.30);
          playTone(990, 0.36, 0.16, "square", 0.30);
          playTone(1320, 0.56, 0.20, "square", 0.30);
        },
        soft: () => {
          playTone(523, 0.00, 0.35, "sine", 0.16);
          playTone(659, 0.38, 0.35, "sine", 0.16);
          playTone(784, 0.76, 0.45, "sine", 0.14);
        }
      };

      const play = patterns[type] || patterns.urgent;
      play();
      alarm.intervalId = setInterval(play, type === "soft" ? 1800 : 1100);
    }

    function stopAlarmSound() {
      if (alarm.intervalId) clearInterval(alarm.intervalId);
      alarm.intervalId = null;
      if (alarm.audioContext) {
        alarm.audioContext.close().catch(() => {});
      }
      alarm.audioContext = null;
    }

    function stopAlarm() {
      stopAlarmSound();
      $("alarmOverlay").classList.remove("show");
    }

    function saveReview() {
      state.reviews[todayKey()] = $("reviewText").value.trim();
      saveState();
      renderReviewDashboard();
      alert("振り返りを保存しました。");
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `focus-dashboard-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          state = { ...defaultState(), ...imported, settings: { ...defaultState().settings, ...(imported.settings || {}) } };
          saveState();
          resetTimer();
          render();
          alert("データを読み込みました。");
        } catch {
          alert("読み込みに失敗しました。JSONファイルを確認してください。");
        }
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      const ok = confirm("全データを削除します。戻せません。実行しますか？");
      if (!ok) return;
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      resetTimer();
      render();
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function clamp(num, min, max) {
      if (Number.isNaN(num)) return min;
      return Math.min(max, Math.max(min, num));
    }

    function hashCode(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return hash;
    }

    window.setCurrentTask = setCurrentTask;
    window.toggleDone = toggleDone;
    window.deleteTask = deleteTask;

    $("addTaskBtn").addEventListener("click", addTask);
    $("taskInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });
    $("startPauseBtn").addEventListener("click", startPauseTimer);
    $("resetTimerBtn").addEventListener("click", resetTimer);
    $("shortBreakBtn").addEventListener("click", () => setBreak(false));
    $("longBreakBtn").addEventListener("click", () => setBreak(true));
    $("saveSettingsBtn").addEventListener("click", saveSettings);
    $("stopAlarmBtn").addEventListener("click", stopAlarm);
    $("saveReviewBtn").addEventListener("click", saveReview);
    $("reviewRange").addEventListener("change", renderReviewDashboard);
    $("reviewCategory").addEventListener("change", renderReviewDashboard);
    $("exportBtn").addEventListener("click", exportData);
    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) importData(file);
    });
    $("resetDataBtn").addEventListener("click", resetAllData);

    migrateDateIfNeeded();
    render();
  </script>
</body>
</html>
